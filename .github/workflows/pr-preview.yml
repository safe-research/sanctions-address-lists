name: PR preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Run all sources and generate outputs
        id: run_sources
        continue-on-error: true
        run: sanctions-address-lists run --output-dir dist

      - name: Upload lists as a build artifact
        if: always() && steps.run_sources.outcome != 'cancelled'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanctions-address-lists-pr-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 14
          if-no-files-found: warn

      - name: Build PR comment body
        if: always() && steps.run_sources.outcome != 'cancelled'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY' > /tmp/pr-comment.md
          import json
          import os

          MARKER = "<!-- sanctions-address-lists-preview -->"
          try:
              entries = json.load(open("dist/manifest.json"))
          except FileNotFoundError:
              entries = []

          icons = {"success": "✅", "unverified": "🟡", "unsupported": "⚪", "failed": "❌"}
          lines = [
              MARKER,
              "### Sanctions address lists preview",
              "",
              "| Source | Status | Records | Addresses |",
              "|---|---|---:|---:|",
          ]
          for e in entries:
              status = e["status"]
              cell = f"{icons.get(status, '❓')} {status}"
              if status == "failed" and e.get("error"):
                  cell += f"<br><sub>{e['error']}</sub>"
              lines.append(f"| `{e['source_id']}` | {cell} | {e['record_count']} | {e['address_count']} |")

          artifact_name = f"sanctions-address-lists-pr-{os.environ['PR_NUMBER']}"
          lines += [
              "",
              f"Full CSV/JSON/TXT outputs and manifest.json are attached as the "
              f"`{artifact_name}` build artifact on this workflow run (see the "
              f"checks tab above).",
          ]
          print("\n".join(lines))
          PY

      - name: Comment on PR
        if: always() && steps.run_sources.outcome != 'cancelled'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8')
            const marker = '<!-- sanctions-address-lists-preview -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }

      - name: Fail the job if a gating source failed
        if: steps.run_sources.outcome == 'failure'
        run: exit 1
