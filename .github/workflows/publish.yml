name: Publish sanctions address lists
# Runs the full pipeline against live sources and keeps the "latest" GitHub
# Release up to date with the results:
#   - CSV/JSON/TXT assets are only re-uploaded when a source's address list
#     actually changed since the last publish (byte-compared against the
#     currently published release, see the "Check for changes" step below).
#   - manifest.json is refreshed every run regardless, so its status/counts/
#     retrieved_at stay current even on a day with no address changes.
#   - A source that fails doesn't block the others: whatever succeeded still
#     gets published, and the job is marked failed for visibility.

on:
  schedule:
    # 04:17 UTC, daily. Off-the-hour to avoid the traffic spike most
    # scheduled workflows create by running exactly on the hour.
    - cron: "17 4 * * *"
  # Lets a maintainer trigger this manually from the Actions tab (or `gh
  # workflow run publish.yml`) instead of waiting for the next schedule.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Run all sources and generate outputs
        id: run_sources
        run: sanctions-address-lists run --output-dir dist
      - name: Validate outputs are not unexpectedly empty
        if: always() && steps.run_sources.outcome != 'cancelled'
        run: |
          set -euo pipefail
          test -s dist/manifest.json
          shopt -s nullglob
          files=(dist/csv/*.csv dist/json/*.json dist/txt/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no output files were generated by any source"
            exit 1
          fi
          for f in "${files[@]}"; do
            [ -s "$f" ] || { echo "::error::$f is empty"; exit 1; }
          done
      - name: Check for changes vs the current release
        # Compares today's CSV/JSON/TXT against what's already published, so a
        # day with no actual address changes doesn't create a no-op release
        # update. manifest.json is deliberately excluded from this comparison
        # -- it always carries a fresh retrieved_at/content_hash and would
        # otherwise never compare equal.
        id: diff
        if: always() && steps.run_sources.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/previous-release
          if ! gh release download latest --repo "$GITHUB_REPOSITORY" \
              --dir /tmp/previous-release \
              --pattern "*.csv" --pattern "*.json" --pattern "*.txt" --clobber; then
            echo "::notice::no previous 'latest' release found (or nothing downloaded) -- treating this run as changed"
          fi
          # manifest.json also matches *.json above -- exclude it from the diff.
          rm -f /tmp/previous-release/manifest.json

          changed=false
          shopt -s nullglob
          for f in dist/csv/*.csv dist/json/*.json dist/txt/*.txt; do
            name="$(basename "$f")"
            if [ ! -f "/tmp/previous-release/$name" ] || ! cmp -s "$f" "/tmp/previous-release/$name"; then
              echo "changed: $name"
              changed=true
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish release assets (lists changed)
        # Publish whatever succeeded even if a gating source failed above, so a
        # single broken source doesn't withhold every other source's update.
        # The job's overall status still reflects the failure for visibility.
        if: always() && steps.run_sources.outcome != 'cancelled' && steps.diff.outputs.changed == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: Latest sanctions address lists
          body: >
            Automatically updated when the generated address lists change.
            See manifest.json for per-source status, provenance, and counts.
          files: |
            dist/csv/*.csv
            dist/json/*.json
            dist/txt/*.txt
            dist/manifest.json

      - name: Refresh manifest.json only (no list changes today)
        # Keeps the published manifest's retrieved_at/status/counts current
        # even on a day with no address changes, without touching (or
        # re-triggering notifications for) the CSV/JSON/TXT assets.
        if: always() && steps.run_sources.outcome != 'cancelled' && steps.diff.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest dist/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
